
<section id="klasyfikacja">
    <style>
        #klasyfikacja .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        #klasyfikacja #data-selector {
            padding: 6px 10px;
            font: inherit;
        }

        #klasyfikacja .error {
            color: #b00020;
            font-weight: bold;
        }
    </style>

    <h2>Klasyfikacja typera</h2>

    <div class="controls">
        <label for="data-selector">Wybierz typera:</label>
        <select id="data-selector" disabled>
            <option value="">Pobieranie listy typerów...</option>
        </select>
    </div>

    <p id="dispatcher-status">Wczytywanie danych...</p>

    <div id="classification-content"></div>

    <script>
        (function () {
            const section = document.getElementById("klasyfikacja");
            const dataSelector = section.querySelector("#data-selector");
            const status = section.querySelector("#dispatcher-status");
            const content = section.querySelector("#classification-content");

            const REPO_API =
                "https://api.github.com/repos/Jan0Pawel/MajstrowyTyperF1/contents/2026/typy";

            let requestId = 0;

            // Pobieranie nazwy typera z nazwy pliku
            function getTyperName(filePath) {
                return filePath
                    .split("/")
                    .pop()
                    .replace(/\.csv$/i, "");
            }

            // Automatyczne pobieranie listy plików CSV z GitHub
            async function loadTyperList() {
                status.textContent = "Pobieranie listy typerów...";

                try {
                    const response = await fetch(REPO_API, {
                        cache: "no-store"
                    });

                    if (!response.ok) {
                        throw new Error(
                            "Nie udało się pobrać listy typerów. HTTP " +
                            response.status
                        );
                    }

                    const files = await response.json();

                    const csvFiles = files
                        .filter(file =>
                            file.type === "file" &&
                            /\.csv$/i.test(file.name)
                        )
                        .sort((a, b) =>
                            a.name.localeCompare(b.name, "pl", {
                                numeric: true,
                                sensitivity: "base"
                            })
                        );

                    if (csvFiles.length === 0) {
                        throw new Error(
                            "W katalogu 2026/typy/ nie znaleziono plików CSV."
                        );
                    }

                    dataSelector.replaceChildren();

                    csvFiles.forEach(file => {
                        const option = document.createElement("option");

                        option.value = "2026/typy/" + file.name;
                        option.textContent = getTyperName(file.name);

                        dataSelector.appendChild(option);
                    });

                    dataSelector.disabled = false;

                    // Automatyczne wczytanie pierwszego typera
                    await loadClassification();

                } catch (error) {
                    status.textContent = error.message;
                    status.className = "error";
                    console.error(error);
                }
            }

            // Rozpoznawanie formatu i ładowanie klasyfikacji
            async function loadClassification() {
                const currentRequest = ++requestId;
                const csvFile = dataSelector.value;

                if (!csvFile) return;

                status.textContent = "Rozpoznawanie formatu typera...";
                status.className = "";

                try {
                    // Pobranie pliku CSV
                    const response = await fetch(csvFile);

                    if (!response.ok) {
                        throw new Error(
                            "Nie udało się pobrać pliku " + csvFile
                        );
                    }

                    const csvText = await response.text();

                    if (currentRequest !== requestId) return;

                    // Odczyt nagłówków
                    const headerLine = csvText
                        .replace(/^\uFEFF/, "")
                        .split(/\r?\n/, 1)[0];

                    const headers = headerLine
                        .split(";")
                        .map(header => header.trim());

                    // Rozpoznawanie formatu
                    const isSprint = ["SD1", "SD2", "SD3"].every(column =>
                        headers.includes(column)
                    );

                    // Wybór odpowiedniego pliku HTML
                    const templateFile = isSprint
                        ? "tables/klas.spr.2026.html"
                        : "tables/klas.norm.2026.html";

                    // Pobranie pliku klasyfikacji
                    const templateResponse = await fetch(templateFile);

                    if (!templateResponse.ok) {
                        throw new Error(
                            "Nie udało się pobrać pliku " + templateFile
                        );
                    }

                    const html = await templateResponse.text();

                    if (currentRequest !== requestId) return;

                    // Przygotowanie HTML
                    const template = document.createElement("template");
                    template.innerHTML = html;

                    // Pobranie skryptów
                    const scripts = Array.from(
                        template.content.querySelectorAll("script")
                    );

                    const scriptContents = scripts.map(script => ({
                        src: script.getAttribute("src"),
                        code: script.textContent,
                        type: script.getAttribute("type")
                    }));

                    scripts.forEach(script => script.remove());

                    // Przekazanie ścieżki CSV do pliku klasyfikacji
                    content.dataset.csvFile = csvFile;

                    // Wstawienie klasyfikacji
                    content.replaceChildren(template.content);

                    // Uruchomienie skryptów klasyfikacji
                    for (const scriptInfo of scriptContents) {
                        if (currentRequest !== requestId) return;

                        const script = document.createElement("script");

                        if (scriptInfo.type) {
                            script.type = scriptInfo.type;
                        }

                        if (scriptInfo.src) {
                            await new Promise((resolve, reject) => {
                                script.onload = () => {
                                    script.remove();
                                    resolve();
                                };

                                script.onerror = () => {
                                    script.remove();
                                    reject(
                                        new Error(
                                            "Nie udało się uruchomić skryptu."
                                        )
                                    );
                                };

                                script.src = scriptInfo.src;
                                document.body.appendChild(script);
                            });
                        } else {
                            script.textContent = scriptInfo.code;
                            document.body.appendChild(script);
                            script.remove();
                        }
                    }

                    if (currentRequest === requestId) {
                        status.textContent = "";
                    }

                } catch (error) {
                    if (currentRequest !== requestId) return;

                    status.textContent = error.message;
                    status.className = "error";
                    console.error(error);
                }
            }

            dataSelector.addEventListener("change", loadClassification);

            loadTyperList();
        })();
    </script>
</section>


<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statystyki typera</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f4f4;
            color: #222;
        }

        h1 {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>Statystyki typera</h1>

    <main id="tables-container">
        <p>Wczytywanie tabeli...</p>
    </main>

    <script>
        async function loadTemplate(url, container) {
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(
                    "Nie udało się wczytać pliku: " + url
                );
            }

            const html = await response.text();

            const template = document.createElement("template");
            template.innerHTML = html;

            const scripts = Array.from(
                template.content.querySelectorAll("script")
            );

            const scriptContents = scripts.map(script => ({
                src: script.getAttribute("src"),
                code: script.textContent,
                type: script.getAttribute("type")
            }));

            scripts.forEach(script => script.remove());

            container.replaceChildren(template.content);

            for (const scriptInfo of scriptContents) {
                const script = document.createElement("script");

                if (scriptInfo.type) {
                    script.type = scriptInfo.type;
                }

                if (scriptInfo.src) {
                    script.src = scriptInfo.src;
                    document.body.appendChild(script);

                    await new Promise((resolve, reject) => {
                        script.onload = resolve;
                        script.onerror = () => reject(
                            new Error("Nie udało się uruchomić skryptu.")
                        );
                    });
                } else {
                    script.textContent = scriptInfo.code;
                    document.body.appendChild(script);
                    script.remove();
                }
            }
        }

        async function initPage() {
            const container = document.getElementById("tables-container");

            try {
                await loadTemplate(
                    "tables/klasyfikacja.html",
                    container
                );
            } catch (error) {
                container.textContent = error.message;
                console.error(error);
            }
        }

        initPage();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statystyki majstrowego typera</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f4f4;
            color: #222;
        }

        h1 {
            margin-bottom: 20px;
        }

        .page-controls {
            margin-bottom: 20px;
        }

        .page-controls button {
            padding: 9px 15px;
            border: none;
            border-radius: 5px;
            background: #26384b;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        .page-controls select {
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            background: white;
            color: #222;
            cursor: pointer;
        }

        .page-controls button:hover {
            background: #3b526b;
        }

        #general-container {
            margin-bottom: 30px;
        }

        #general-container[hidden] {
            display: none;
        }
        #teams-container {
            margin-bottom: 30px;
        }

        #teams-container[hidden] {
            display: none;
        }
    </style>
</head>
<body>

    <h1>Statystyki typera</h1>

    <div class="page-controls">
        <label for="season-select">Sezon:</label>
        <select id="season-select">
            <option value="2026" selected>2026</option>
        </select>
        <button
            id="toggle-general"
            type="button"
            aria-expanded="false"
        >
            Pokaż klasyfikację generalną
        </button>
    
        <button
            id="toggle-teams"
            type="button"
            aria-expanded="false"
        >
            Pokaż klasyfikację zespołów
        </button>
    </div>

    <section id="general-container" hidden></section>

    <section id="teams-container" hidden></section>

    <main id="tables-container">
        <p>Wczytywanie tabeli...</p>
    </main>

    <script>
        async function loadTemplate(url, container) {
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(
                    "Nie udało się wczytać pliku: " + url
                );
            }

            const html = await response.text();

            const template = document.createElement("template");
            template.innerHTML = html;

            const scripts = Array.from(
                template.content.querySelectorAll("script")
            );

            const scriptContents = scripts.map(script => ({
                src: script.getAttribute("src"),
                code: script.textContent,
                type: script.getAttribute("type")
            }));

            scripts.forEach(script => script.remove());

            container.replaceChildren(template.content);

            for (const scriptInfo of scriptContents) {
                const script = document.createElement("script");

                if (scriptInfo.type) {
                    script.type = scriptInfo.type;
                }

                if (scriptInfo.src) {
                    script.onload = () => script.remove();
                    script.onerror = () => {
                        script.remove();
                        console.error("Nie udało się uruchomić skryptu.");
                    };
                    script.src = scriptInfo.src;
                    document.body.appendChild(script);

                    await new Promise((resolve, reject) => {
                        script.onload = resolve;
                        script.onerror = () => reject(
                            new Error("Nie udało się uruchomić skryptu.")
                        );
                    });
                } else {
                    const isolatedScript = document.createElement("script");

                    isolatedScript.textContent = `
                        (() => {
                            ${scriptInfo.code}
                        })();
                    `;
                
                    document.body.appendChild(isolatedScript);
                    isolatedScript.remove();
                }
            }
        }

        async function initPage() {
            const container = document.getElementById("tables-container");

            try {
                await loadTemplate(
                    "tables/klasyfikacja.html",
                    container
                );
            } catch (error) {
                container.textContent = error.message;
                console.error(error);
            }
        }

        const generalContainer = document.getElementById("general-container");
        const toggleGeneralButton = document.getElementById("toggle-general");

        let generalLoaded = false;

        const teamsContainer = document.getElementById("teams-container");
        const toggleTeamsButton = document.getElementById("toggle-teams");

        let teamsLoaded = false;
        
        function closeGeneralClassification() {
    generalContainer.hidden = true;
    toggleGeneralButton.textContent = "Pokaż klasyfikację generalną";
    toggleGeneralButton.setAttribute("aria-expanded", "false");
}

function closeTeamsClassification() {
    teamsContainer.hidden = true;
    toggleTeamsButton.textContent = "Pokaż klasyfikację zespołów";
    toggleTeamsButton.setAttribute("aria-expanded", "false");
}

toggleGeneralButton.addEventListener("click", async () => {
    const isVisible = !generalContainer.hidden;

    if (isVisible) {
        closeGeneralClassification();
        return;
    }

    // Zamknij klasyfikację zespołów.
    closeTeamsClassification();

    generalContainer.hidden = false;
    toggleGeneralButton.textContent = "Ukryj klasyfikację generalną";
    toggleGeneralButton.setAttribute("aria-expanded", "true");

    if (!generalLoaded) {
        try {
            await loadTemplate(
                "tables/klas.gen.2026.html",
                generalContainer
            );

            generalLoaded = true;
        } catch (error) {
            generalContainer.textContent = error.message;
            console.error(error);
        }
    }
});

toggleTeamsButton.addEventListener("click", async () => {
    const isVisible = !teamsContainer.hidden;

    if (isVisible) {
        closeTeamsClassification();
        return;
    }

    // Zamknij klasyfikację generalną.
    closeGeneralClassification();

    teamsContainer.hidden = false;
    toggleTeamsButton.textContent = "Ukryj klasyfikację zespołów";
    toggleTeamsButton.setAttribute("aria-expanded", "true");

    if (!teamsLoaded) {
        try {
            await loadTemplate(
                "tables/klas.zesp.2026.html",
                teamsContainer
            );

            teamsLoaded = true;
        } catch (error) {
            teamsContainer.textContent = error.message;
            console.error(error);
        }
    }
});
        initPage();
    </script>

</body>
</html>
